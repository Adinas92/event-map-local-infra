name: Sensitive data
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENT_MAP_TOOLS_SHA: '07af0c2c0bd420bbe514a2c616eed0559598a537' # pragma: allowlist secret -- immutable source revision, not a credential
    steps:
      - name: Checkout scanned repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Require private tools access
        shell: bash
        env:
          EVENT_MAP_TOOLS_READ_TOKEN: ${{ secrets.EVENT_MAP_TOOLS_READ_TOKEN }}
        run: |
          set +x
          if [ -z "$EVENT_MAP_TOOLS_READ_TOKEN" ]; then
            echo "Security scan ERROR: EVENT_MAP_TOOLS_READ_TOKEN is required; no PASS." >&2
            exit 2
          fi
      - name: Checkout pinned private tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Adinas92/event-map-tools
          ref: ${{ env.EVENT_MAP_TOOLS_SHA }}
          token: ${{ secrets.EVENT_MAP_TOOLS_READ_TOKEN }}
          path: tools
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked tools in isolated environment
        shell: bash
        run: |
          test "$(git -C tools rev-parse HEAD)" = "$EVENT_MAP_TOOLS_SHA" || exit 2
          python -m venv "$RUNNER_TEMP/event-map-tools-venv"
          "$RUNNER_TEMP/event-map-tools-venv/bin/python" -m pip --no-cache-dir install --require-hashes --only-binary=:all: -r tools/requirements/security.lock
          "$RUNNER_TEMP/event-map-tools-venv/bin/python" -m pip --no-cache-dir install --no-index --no-deps --no-build-isolation ./tools
      - name: Scan tracked files without publishing values
        shell: bash
        run: |
          env -i PATH="$RUNNER_TEMP/event-map-tools-venv/bin:/usr/local/bin:/usr/bin:/bin" LANG=C.UTF-8 "$RUNNER_TEMP/event-map-tools-venv/bin/event-map-security" --repo source
      - name: Scan introduced history
        if: github.event_name == 'pull_request'
        env:
          SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          env -i PATH="$RUNNER_TEMP/event-map-tools-venv/bin:/usr/local/bin:/usr/bin:/bin" LANG=C.UTF-8 "$RUNNER_TEMP/event-map-tools-venv/bin/event-map-security" --repo source --history-range="$SCAN_BASE_SHA..HEAD"
      - name: Remove private tool checkout and environment
        if: always()
        shell: bash
        run: |
          rm -rf -- "${GITHUB_WORKSPACE:?}/tools" "${RUNNER_TEMP:?}/event-map-tools-venv"
