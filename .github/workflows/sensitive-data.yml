name: Sensitive data
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install detect-secrets==1.5.0
      - run: python -m unittest discover -s scripts -p test_security_scan.py -v
      - name: Scan tracked files without publishing values
        run: python scripts/security_scan.py
      - name: Scan introduced history
        if: github.event_name == 'pull_request'
        env:
          SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/security_scan.py --history-range="$SCAN_BASE_SHA..HEAD"
